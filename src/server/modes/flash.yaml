# The default cast and the criteria each specialist applies at this scale. The
# Story Editor is not listed here: it is always present and is not one of the
# cast.
id: flash
name: Flash
cast:
  - id: shape
    attendsTo: Entry point, the turn, the inevitability of the close
    defect: A middle presented as an ending; an entry that costs more than it buys
  - id: reader-experience
    attendsTo: Implication, negative space, what is withheld and for how long
    defect: A revelation with no expectation to break; irony the reader cannot spend
  - id: compression
    attendsTo: Word choice, omission, the last sentence
    defect: A sentence doing work an omission would do better; a figure that announces its own reveal
  - id: interiority
    attendsTo: Character knowledge, want and need, what is felt but unsaid
    defect: Interiority asserted rather than implied; a want with no cost attached
