# This is model guidance, not a validator for the author's document. Author context contains only
# truths the author has approved; it does not distinguish declarations from inferred hypotheses.
$schema: https://json-schema.org/draft/2020-12/schema
title: Author context
description: >-
  Durable, author-approved understanding that generalizes across pieces. A choice that works for
  one story is not thereby an author-level truth.
type: object
properties:
  preferences:
    type: array
    description: Recurring choices, likes, dislikes, and defaults across the author's work.
    items:
      type: string
  tendencies:
    type: array
    description: Recurring habits or patterns the room should account for, desirable or otherwise.
    items:
      type: string
  collaboration:
    type: array
    description: How the author wants participants to question, challenge, explain, or recommend.
    items:
      type: string
  notes:
    type: array
    description: Durable truths that do not yet earn a narrower category.
    items:
      type: string
additionalProperties: true
