# Story context reference

Guidance for what this piece's story context can hold — not a form to fill in, and nothing here
is enforced. Organize it however reads best; the shape below is a starting point, not a
requirement.

A story context document is a set of freely named **sections** — a heading you choose, such as
"Characters" or "Setting" or "Where this is going" — each holding one or more **entries**: a
short passage of prose noting one fact, decision, or intention. An entry can be added, revised,
replaced with a new entry, or removed outright as the piece develops; nothing about the document
tracks that history, so write the current understanding, not a log of how it changed.

At flash length, a light touch serves better than a full cast bible: a line on who the piece is
about, a line on where and when it happens, and a line on the turn it is building toward is
often the whole of it.
